repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and security checks
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
